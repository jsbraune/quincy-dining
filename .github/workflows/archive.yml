name: archive

# The upstream feed keeps ~13 days and no history, so a missed run is
# permanent data loss. Three runs a day gives us margin: any single failed
# run is covered by the next, and the archiver re-checks the prior 2 days.
#
# Times are UTC. These are ~05:00 / 11:00 / 16:00 America/New_York during
# EDT and shift an hour during EST -- harmless, since we refetch the whole
# window every run rather than depending on wall-clock alignment.
on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run archiver
        run: python3 archiver/archive.py

      - name: Commit any new or changed data
        run: |
          git config user.name  "quincy-dining archiver"
          git config user.email "actions@github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "archive: $(date -u +%Y-%m-%dT%H:%MZ)"
          # A concurrent run or a local push can move HEAD under us.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          exit 1
